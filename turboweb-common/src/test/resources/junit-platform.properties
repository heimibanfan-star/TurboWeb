# 串行执行的原因（spec §7.1）：以下三处 JVM 全局静态使并行不安全
#   Locks.SESSION_LOCK / DiskOpeThreadUtils / VirtualThreads.getPool()
junit.jupiter.execution.parallel.enabled=false
# 超时兜底必须是 SEPARATE_THREAD：SAME_THREAD 只能靠中断打断用例，遇上不响应中断的阻塞
# 永远兜不住；写错值不会让用例变红，引擎只发 JUL 警告再静默回退
junit.jupiter.execution.timeout.default=30s
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD
